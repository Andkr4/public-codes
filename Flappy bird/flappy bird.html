<!DOCTYPE html>
<head>
    <title> flappy bird </title>
    <link rel="stylesheet" href="flappy bird.css">
</head>
<body>
    <div id="game">
        <div class="moving-background"></div>
        <div class="pipe-pair" id="pipe1">
            <div class="pipe top-pipe"></div>
            <div class="pipe bottom-pipe"></div>
        </div>

        <div class="pipe-pair" id="pipe2">
            <div class="pipe top-pipe"></div>
            <div class="pipe bottom-pipe"></div>
        </div>

        <div class="pipe-pair" id="pipe3">
            <div class="pipe top-pipe"></div>
            <div class="pipe bottom-pipe"></div>
        </div>
        <div id="bird">
            <div class="left eye"></div>
            <div class="right eye"></div>
            <div class="mouth"></div>
        </div>
        <div id="scoreCount">Score: 0</div>
        <div id="highScoreCount"></div>
        <div id="scoreBox"></div>
        <div id="howToRestart">Press Enter to Restart</div>
        <div id="howToStart">Press Space to Start</div>
        <script src="flappy bird.js"></script>
    </div>
    
</body>
