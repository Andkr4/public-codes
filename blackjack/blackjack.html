<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="blackjack.css">
    </head>
    <body>
        <h1>Blackjack</h1>
        <div id="start-screen">
            <p id="message-el">Want to play a round?</p>
            <button id="start-btn" onclick="startGame()">START GAME</button>
        </div>
        
        <div id="bet-screen">
            <h2>Place your bet</h2>

            <p id="current-bet">Current Bet: $0</p>
            <p id="betting-chips">Your Chips: $200</p>

            <div id="betting-area"></div>

            <div id="chip-buttons">
                <button onclick="addBet(5)">$5</button>
                <button onclick="addBet(10)">$10</button>
                <button onclick="addBet(25)">$25</button>
                <button onclick="addBet(50)">$50</button>
                <button onclick="addBet(100)">$100</button>
            </div>

            <button id="clear-bet" onclick="clearBet()">CLEAR BET</button>
            <button id="place-bet" onclick="betPlaced()">PLACE BET</button>
        </div>

        <div id="game-screen">
            <div id="dealer-area">
                <div id="dealer-cards"></div>
                <p id="dealer-sum"></p>
            </div>
            <div id="deck-pile" class="playing-card card-back"></div>
            <p id="message2-el"> </p>
            <div id="player-area"></div>
            <div id="cards-el">Cards:</div>
            <p id="sum-el">Sum:</p>
            <div id="controls">
                <button id="hit-btn" onclick="hit()">HIT</button>
                <button id="stay-btn" onclick="stay()">STAY</button>
                <button id="new-round" onclick="newRound()">NEW ROUND? (SAME BET)</button>
                <button id="change-bet" onclick="changeBet()">CHANGE BET</button>
            </div>
            <p id="player-el"></p>
            <p id="placed-bet"></p>
        </div>
        <div id="game-over-screen">
            <h1>Game Over</h1>
            <br>
            <h1>You ran out of chips</h1>
        </div>
        <script src="blackjack.js"></script>
    </body>
</html>
